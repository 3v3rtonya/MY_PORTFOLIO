app = "everton-portfolio-api"
primary_region = "jnb"   # Johannesburg — closest to Kenya

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = false   # no cold starts
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "10s"
    interval      = "30s"
    method        = "GET"
    path          = "/api/v1/health"
    timeout       = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
